<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="slide">
      <div class="frame">
        <div
          class="box page-number"
          style="left: 860px; top: 44px; width: 140px; height: 44px; font-size: 26px"
          data-fit="shrink"
          data-min-font-size="18"
        >
          {{page_number}}
        </div>

        <div
          class="box headline"
          style="left: 80px; top: 140px; width: 920px; height: 260px; font-size: 110px"
          data-fit="shrink"
          data-min-font-size="54"
        >
          {{headline}}
        </div>

        <div
          class="box body"
          style="left: 120px; top: 440px; width: 840px; height: 560px; font-size: 56px"
          data-fit="shrink"
          data-min-font-size="28"
        >
          {{body}}
        </div>

        <div
          class="box footer"
          style="left: 80px; top: 1215px; width: 920px; height: 90px; font-size: 34px"
          data-fit="shrink"
          data-min-font-size="22"
        >
          {{footer}}
        </div>
      </div>
    </div>
  </body>
</html>
